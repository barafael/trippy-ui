[package]
name = "trippy-ui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A windowed port of trippy: trace network paths in a native egui window"
repository = "https://github.com/barafael/trippy-ui"
rust-version = "1.95"

[dependencies]
# The trippy data layer: tracing, reverse DNS and privilege handling. To build
# against a local trippy checkout instead, add an untracked .cargo/config.toml
# with a `[patch.crates-io]` section pointing at ../trippy/crates/<name>.
trippy-core = "0.13.0"
trippy-dns = "0.13.0"
trippy-privilege = "0.13.0"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "wrap_help", "env"] }
etcetera = "0.11"
egui = "0.36.2"
egui_extras = { version = "0.36.2", default-features = false }
egui_plot = "0.37.0"
humantime = "2"
itertools = "0.15"
maxminddb = "0.28"
serde = { version = "1", default-features = false, features = ["derive"] }
toml = { version = "1", default-features = false, features = ["serde", "parse"] }

# Desktop only: the window, and system theme discovery on Linux.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "persistence"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["x11", "wayland", "links"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
